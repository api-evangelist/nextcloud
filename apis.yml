aid: nextcloud
name: Nextcloud
description: >-
  Nextcloud is an open-source, self-hosted productivity platform offering
  file sync and share, collaboration, communication (Talk, Mail, Calendar,
  Contacts), and office (Nextcloud Office) features as a privacy-focused
  alternative to public cloud suites. Hosted in private datacenters or
  on-premises, Nextcloud is widely used by enterprises, governments, and
  individuals. The Nextcloud APIs include OCS REST APIs, WebDAV for
  file/folder operations, CalDAV/CardDAV, and an OpenAPI-described
  developer surface for apps and integrations.
